---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: wallets.shophub.io
spec:
  group: shophub.io
  names:
    kind: Wallet
    listKind: WalletList
    plural: wallets
    shortNames:
    - wallet
    singular: wallet
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.mode
      name: Mode
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Wallet is an Ethereum Sepolia account that receives a shop's
          payments.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Wallet
            properties:
              address:
                description: |-
                  address is an existing Ethereum (Sepolia) address to register. Omit it to have the
                  operator generate a new account. Immutable once set.
                pattern: ^0x[0-9a-fA-F]{40}$
                type: string
            type: object
            x-kubernetes-validations:
            - message: address is immutable
              rule: '!has(oldSelf.address) || (has(self.address) && self.address ==
                oldSelf.address)'
          status:
            description: status defines the observed state of Wallet
            properties:
              address:
                description: address is the checksummed account address (registered
                  or generated).
                type: string
              conditions:
                description: conditions; type Ready carries the reason codes from
                  contracts/crds.md.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              keySecretName:
                description: keySecretName is the Secret holding the private key (generated
                  mode only).
                type: string
              mode:
                description: mode is registered or generated.
                enum:
                - registered
                - generated
                type: string
              observedGeneration:
                description: observedGeneration is the metadata.generation last reconciled.
                format: int64
                type: integer
              payments:
                description: payments is the payment watcher's progress for this address
                  (spec 005 research R3).
                properties:
                  lastError:
                    description: |-
                      lastError is the reason code of the watcher's last failure for this address
                      (RPCCredentialsMissing, ProviderError, WrongChain, CursorAheadOfChain or ShopUnreachable);
                      empty after a success.
                    type: string
                  lastErrorMessage:
                    description: lastErrorMessage explains lastError; it never contains
                      the provider URL or a token.
                    type: string
                  lastErrorTime:
                    description: lastErrorTime is when lastError was last seen.
                    format: date-time
                    type: string
                  scannedThroughBlock:
                    description: scannedThroughBlock is the last confirmed block whose
                      transfers the owning shop accepted.
                    format: int64
                    type: integer
                  scannedThroughTime:
                    description: scannedThroughTime is that block's time.
                    format: date-time
                    type: string
                type: object
              usedBy:
                description: usedBy lists the Shops in this namespace that reference
                  this Wallet.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
