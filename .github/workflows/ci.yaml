# CI for shop-operator (spec 002, research R16).
# PR / push to main: lint + test (required checks). Tag vX.Y.Z: lint + test + release image to GHCR.
name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        run: make lint

  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod
      - name: Generated code and CRDs are up to date
        run: |
          make manifests generate
          git diff --exit-code -- api config || { echo "::error::run 'make manifests generate' and commit the result"; exit 1; }
      - name: Unit + envtest integration tests
        run: make test

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Tag must be strict SemVer vMAJOR.MINOR.PATCH
        id: ver
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::tag '$tag' is not vMAJOR.MINOR.PATCH"; exit 1; }
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite an existing version
        run: |
          if docker manifest inspect "ghcr.io/nikola031ue/shop-operator:${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::image version ${{ steps.ver.outputs.version }} already exists"; exit 1
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/nikola031ue/shop-operator:${{ steps.ver.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
